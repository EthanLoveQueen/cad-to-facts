name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Check runtime
        run: uv run facts doctor --check
      - name: Run public-interface tests
        run: uv run pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution contents
        run: uv run python scripts/check_dist.py dist
